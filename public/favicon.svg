  <text x="256" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#2dd4bf" text-anchor="middle" dominant-baseline="middle">72.5 kg</text>
  
  <!-- Símbolo Bluetooth / Conexão no centro -->
