  </defs>
  
  <!-- Base da Balança -->
  <rect x="48" y="48" width="416" height="416" rx="64" fill="url(#glassGrad)" stroke="#475569" stroke-width="12"/>
  
  <!-- Sensores metálicos de bioimpedância (cantos) -->
  <circle cx="120" cy="120" r="40" fill="#0d9488" opacity="0.3" stroke="#2dd4bf" stroke-width="6"/>
  <circle cx="392" cy="120" r="40" fill="#0d9488" opacity="0.3" stroke="#2dd4bf" stroke-width="6"/>
